<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandi Kata - Rahasia Bahasa Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-teal-50 to-emerald-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full glass rounded-3xl shadow-2xl overflow-hidden border border-white">
        <!-- Header -->
        <div class="bg-emerald-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">Sandi Kata</h1>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            <!-- Input Area -->
            <div>
                <label for="inputText" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider">Pesan</label>
                <textarea id="inputText" rows="4" 
                    class="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition-all resize-none text-gray-800"
                    placeholder=""></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="processText('encrypt')" 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition-all active:scale-95 flex items-center justify-center shadow-lg shadow-emerald-200">
                    Before (Enkripsi)
                </button>
                <button onclick="processText('decrypt')" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all active:scale-95 flex items-center justify-center shadow-lg shadow-blue-200">
                    After (Dekripsi)
                </button>
            </div>

            <!-- Output Area -->
            <div class="relative group">
                <label for="outputText" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider">Hasil</label>
                <textarea id="outputText" rows="4" readonly
                    class="w-full p-4 border-2 border-emerald-50 rounded-xl bg-emerald-50/50 text-emerald-900 font-medium text-sm outline-none resize-none"
                    placeholder=""></textarea>
                
                <!-- Floating Copy Button -->
                <button onclick="copyToClipboard()" 
                    class="absolute top-9 right-2 bg-white hover:bg-gray-100 text-gray-700 border border-gray-200 p-2 rounded-lg transition-all active:scale-90 shadow-sm flex items-center text-xs font-semibold">
                    <span id="copyText">Salin Hasil</span>
                </button>
            </div>

            <button onclick="clearAll()" class="w-full text-gray-400 hover:text-red-500 text-sm font-medium py-2">Bersihkan</button>
        </div>
    </div>

    <script>
                // Mapping Huruf ke Nama Senyawa Kimia
        const dictionary = {
    'a': 'o',
    'b': 'g',
    'c': 'e',
    'd': 'p',
    'e': 'c',
    'f': 'y',
    'g': 'j',
    'h': 'n',
    'i': 'u',
    'j': 'd',
    'k': 'l',
    'l': 'r',
    'm': 'b',
    'n': 's',
    'o': 'a',
    'p': 'h',
    'q': 'z',
    'r': 'k',
    's': 't',
    't': 'm',
    'u': 'i',
    'v': 'w',
    'w': 'v',
    'x': 'q',
    'y': 'f',
    'z': 'x',
    ' ': ',',
    '0': '10',
    '1': '9',
    '2': '8',
    '3': '1',
    '4': '2',
    '5': '3',
    '6': '7',
    '7': '6',
    '8': '5',
    '9': '4'
        };


        // Kebalikan dictionary untuk Dekripsi
        const reverseDictionary = Object.fromEntries(
            Object.entries(dictionary).map(([k, v]) => [v, k])
        );

        function processText(mode) {
            const input = document.getElementById('inputText').value.toLowerCase();
            const outputField = document.getElementById('outputText');
            let result = "";

            if (!input.trim()) return;

            if (mode === 'encrypt') {
                // ENKRIPSI: Huruf -> Kata
                let words = [];
                for (let char of input) {
                    words.push(dictionary[char] || char);
                }
                result = words.join(" ");
            } else {
                // DEKRIPSI: Kata -> Huruf
                let words = input.split(/\s+/);
                for (let word of words) {
                    result += reverseDictionary[word] || word;
                }
            }

            outputField.value = result;
            document.getElementById('copyText').innerText = "Salin Hasil";
        }

        function clearAll() {
            document.getElementById('inputText').value = "";
            document.getElementById('outputText').value = "";
        }

        async function copyToClipboard() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) return;
            await navigator.clipboard.writeText(outputText);
            document.getElementById('copyText').innerText = "Tersalin!";
            setTimeout(() => { document.getElementById('copyText').innerText = "Salin Hasil"; }, 2000);
        }
    </script>
</body>
</html>
